name: Real-BASCOM Conformance

# Opt-in only: never runs on push/pull_request. Fetches a copy of the
# copyrighted IBM BASIC Compiler 2.00 from the PCjs archive at run time (see
# test-fixtures/README.md) -- trigger manually from the Actions tab when you
# want to validate generated BASIC against the real compiler, e.g. before a
# release.
on:
  workflow_dispatch:

jobs:
  conformance:
    name: dosbox-x conformance suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install dosbox-x and mtools
        run: sudo apt-get update && sudo apt-get install -y dosbox-x mtools

      - name: Fetch IBM BASIC Compiler 2.00
        run: scripts/fetch-ibm-basic-compiler.sh

      - name: Test (including dosbox-x conformance suite)
        run: cargo test --locked

  jvm:
    name: JVM conformance suite
    runs-on: ubuntu-latest
    env:
      KRAK2_COMMIT: ae49743af92bbab1684b19bb1bee22b0a64d8ce5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Cache krak2
        uses: actions/cache@v4
        with:
          path: ~/.local/share/krakatau/${{ env.KRAK2_COMMIT }}
          key: ${{ runner.os }}-krak2-${{ env.KRAK2_COMMIT }}

      - name: Fetch or reuse krak2
        run: scripts/fetch-krak2.sh

      - name: Add krak2 to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Test JVM conformance
        run: cargo test --locked --test jvm_conformance
