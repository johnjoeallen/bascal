[package]
name = "bcc"
version = "0.99.59"
edition = "2021"
license = "GPL-3.0-only"
description = "Compiles structured .bcl source to BASIC, C, or JVM assembly"

[package.metadata.deb]
name = "bascal"
maintainer = "BASCAL contributors"
copyright = "2026 BASCAL contributors"
license-file = ["LICENSE", "0"]
extended-description = """\
BASCAL compiles structured .bcl source to BASIC, C, or JVM assembly.\
"""
section = "devel"
priority = "optional"
assets = [
    ["target/release/bcc", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/bascal/README.md", "644"],
    ["intro.md", "usr/share/doc/bascal/intro.md", "644"],
    ["tutorial/**/*.bcl", "usr/share/doc/bascal/tutorial/", "644"],
    ["tutorial/**/*.md", "usr/share/doc/bascal/tutorial/", "644"],
    ["tutorial/*.bas", "usr/share/doc/bascal/tutorial/", "644"],
    ["tutorial/*.j", "usr/share/doc/bascal/tutorial/", "644"],
    ["tutorial/shared/*.bas", "usr/share/doc/bascal/tutorial/shared/", "644"],
    ["examples/remline/remline.bas", "usr/share/doc/bascal/examples/remline/remline.bas", "644"],
    ["examples/remline/sample/expected.bas", "usr/share/doc/bascal/examples/remline/sample/expected.bas", "644"],
    ["examples/remline/sample/input.bas", "usr/share/doc/bascal/examples/remline/sample/input.bas", "644"],
    ["com/**/*.bcl", "usr/share/bascal/com/", "644"],
]

[dependencies]
clap = { version = "4", features = ["derive"] }
# The `--target jvm` backend's assembler (Krakatau's `v2`, itself GPL-3.0,
# same as this project). Upstream (https://github.com/Storyyeller/Krakatau)
# merged the `[lib]` target exposing `assemble()`/`disassemble()` itself
# (https://github.com/Storyyeller/Krakatau/pull/216), but this still pins a
# commit on our own fork's `lib-stack-helpers` branch, which additionally
# adds `assemble_with_stack`/`disassemble_with_stack` -- needed so a real
# `.j` file's deeply recursive parse can't blow the calling thread's stack
# (see `invoke_krak2` in `main.rs`). That patch is proposed upstream at
# https://github.com/Storyyeller/Krakatau/pull/218; once merged, switch this
# back to `https://github.com/Storyyeller/Krakatau` directly and drop the
# fork.
krakatau2 = { git = "https://github.com/johnjoeallen/Krakatau", rev = "4a98921f53ada8583cd679427e8b3fdef384992e" }

[dev-dependencies]
tempfile = "3"
