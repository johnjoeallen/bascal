# Expected conformance metadata. Code supplies only stable IDs; descriptions,
# groups, applicability, and expected backend states belong here.

[[test]]
id = "core.all_tutorials_compile"
description = "All tutorial .bcl sources compile"
groups = ["core"]
expected = { basic = "PASS", c = "PASS", jvm = "DEFERRED" }

