<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 460" role="img" aria-labelledby="bascal-hero-title">
<title id="bascal-hero-title">A retro all-in-one computer with green phosphor BASIC code on its screen</title>

<defs>
  <radialGradient id="screenGlow" cx="50%" cy="42%" r="65%">
    <stop offset="0%" stop-color="#3ddc84" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#3ddc84" stop-opacity="0"/>
  </radialGradient>
  <pattern id="scanlines" width="6" height="6" patternUnits="userSpaceOnUse">
    <rect width="6" height="3" fill="#000000" opacity="0.16"/>
  </pattern>
</defs>

<ellipse cx="240" cy="434" rx="150" ry="14" fill="#16140f" opacity="0.18"/>

