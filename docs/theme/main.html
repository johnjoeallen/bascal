<!doctype html>
<html lang="{{ config.theme.locale|default('en') }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ config.site_description }}">
  <title>{% if page and page.title %}{{ page.title }} — {% endif %}{{ config.site_name }}</title>
  <link rel="icon" href="{{ 'favicon.svg' | url }}" type="image/svg+xml">
  {% for path in config.extra_css %}<link rel="stylesheet" href="{{ path | url }}">{% endfor %}
  <script>try{var t=localStorage.getItem("bascal-theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
</head>
<body>
  <header class="hero compact"><div class="wrap"><h1>{{ page.title if page else config.site_name }}</h1></div></header>
  <nav class="subnav"><div class="wrap"><a href="{{ nav.homepage.url | url }}">Home</a><a href="{{ 'language/' | url }}">Language Book</a><a href="{{ 'manual/' | url }}">Manual</a><a href="{{ 'tutorials/' | url }}">Tutorials</a><a href="{{ 'examples/' | url }}">Examples</a><a href="{{ config.repo_url }}">GitHub</a><button id="theme-toggle" class="theme-toggle" aria-label="Toggle color theme"></button></div></nav>
  <main class="wrap"><div class="prose">{{ page.content }}</div></main>
  <footer><div class="wrap">BASCAL is licensed under the <a href="https://github.com/johnjoeallen/bascal/blob/main/LICENSE">GNU GPLv3</a>.</div></footer>
  {% for path in config.extra_javascript %}<script src="{{ path | url }}"></script>{% endfor %}
</body>
</html>
