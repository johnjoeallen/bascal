site_name: BASCAL
site_description: A structured language that transpiles to classic BASIC.
site_url: https://johnjoeallen.github.io/bascal/
repo_url: https://github.com/johnjoeallen/bascal
repo_name: johnjoeallen/bascal
docs_dir: docs
site_dir: site
use_directory_urls: true
theme:
  name: null
  custom_dir: docs/theme
hooks:
  - docs_hooks.py
extra_css:
  - style.css
extra_javascript:
  - theme-toggle.js
  - conformance.js
markdown_extensions:
  - attr_list
  - md_in_html
  - def_list
  - tables
  - toc:
      permalink: false
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.superfences
nav:
  - Home:
      - Overview: index.md
      - Why BASCAL exists: home/why-bascal.md
      - What BASCAL adds: home/features.md
      - Structured control flow: home/control-flow.md
      - Record files: home/record-files.md
      - Tutorials and examples: home/tutorials.md
  - Language Book:
      - Overview: language/index.md
      - Preface: language/preface.md
      - A first program: language/first-program.md
      - Values, names, and expressions: language/values-and-names.md
      - Control flow: language/control-flow.md
      - Functions and procedures: language/functions-and-procedures.md
      - Arrays and strings: language/arrays-and-strings.md
      - Data and files: language/data-and-files.md
      - Libraries: language/libraries.md
      - Embedded data: language/embedded-data.md
      - Errors, labels, and data: language/errors-labels-and-data.md
      - Standard library: language/standard-library.md
      - Running and combining programs: language/running-and-combining-programs.md
      - The BASIC beneath: language/the-basic-beneath.md
  - Manual:
      - Overview: manual/index.md
      - Introduction: manual/introduction.md
      - Getting Started: manual/getting-started.md
      - Program Structure: manual/program-structure.md
      - Data Types and Type Suffixes: manual/data-types-and-type-suffixes.md
      - Variables and Constants: manual/variables-and-constants.md
      - Operators and Expressions: manual/operators-and-expressions.md
      - Comments: manual/comments.md
      - Control Flow: manual/control-flow.md
      - Functions: manual/functions.md
      - Procedures: manual/procedures.md
      - Arrays: manual/arrays.md
      - Input and Output: manual/input-and-output.md
      - File Input and Output: manual/file-input-and-output.md
      - Random-Access File I/O: manual/random-access-file-io.md
      - Record Files: manual/record-files.md
      - DATA Statements: manual/data-statements.md
